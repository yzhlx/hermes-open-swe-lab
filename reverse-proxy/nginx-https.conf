# Hermes Open SWE Control Plane — HTTPS reverse proxy (reverse-proxy/nginx-https.conf)
#
# Responsibilities:
#   - terminate TLS for the Worker API (the app itself binds loopback only);
#   - redirect all plaintext HTTP -> HTTPS (no public plaintext API);
#   - expose ONLY /healthz, /readyz and the Worker API to the local Worker.
#
# SECURITY NOTES (MVP-0 hard gates):
#   - The webhook endpoint is intentionally NOT defined here. Webhook stays OFF.
#   - No Docker socket, no admin endpoints, no static file serving.
#   - nginx access logs must NOT capture Authorization / X-Worker-Token.
#
# Deployment: copy to /etc/nginx/sites-available/hermes-swe-control-plane
# and symlink into sites-enabled. Replace HERMES_EXAMPLE_DOMAIN with the
# real, DNS-owned domain. Do NOT modify DNS or purchase certificates as part
# of this line — the cert/key paths are references only.

# Plaintext HTTP: redirect everything to HTTPS. No API is served on :80.
server {
    listen 80;
    listen [::]:80;
    server_name HERMES_EXAMPLE_DOMAIN;

    # Drop any request that somehow lands on :80 (defence in depth).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name HERMES_EXAMPLE_DOMAIN;

    ssl_certificate     /opt/hermes-open-swe-lab/tls/fullchain.pem;
    ssl_certificate_key /opt/hermes-open-swe-lab/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!aNULL;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Hardening headers.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # No server tokens.
    server_tokens off;

    # Worker API + health. All traffic proxied to the loopback Control Plane.
    # The app never sees the public interface; nginx owns TLS.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Access log format MUST exclude request headers (no tokens / auth).
    log_format hermes_json escape=json
        '{ "time":"$time_iso8601", "remote":"$remote_addr", '
        '"method":"$request_method", "path":"$request_uri", '
        '"status":$status, "bytes":$body_bytes_sent }';
    access_log /var/log/nginx/hermes-access.log hermes_json;
    error_log  /var/log/nginx/hermes-error.log warn;
}
