name: Baseline pytest

on:
  pull_request:
    branches:
      - phase-1-smoke
  push:
    branches:
      - phase-1-smoke

permissions:
  contents: read

jobs:
  baseline-pytest:
    name: baseline-pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install test runner
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Collect tests
        run: |
          python -m pytest tests/ --collect-only -q -p no:cacheprovider

      # --- Non-root suite: every baseline test EXCEPT the two deployment tests
      #     that legitimately require root (they invoke `runuser` against the
      #     service user and run separately with `sudo -E` below). The root-refusal
      #     guard (test_check_config_refuses_root) now runs HERE and passes via the
      #     HERMES_SERVICE_USER mismatch gate — no skip. Either suite failing fails
      #     the whole job. ---
      - name: Run non-root baseline test suite
        run: |
          python -m pytest tests/ -v -p no:cacheprovider -rA \
            --deselect tests/deployment/test_cloud.py::test_deploy_idempotency \
            --deselect tests/deployment/test_cloud.py::test_rollback

      # --- Root-required suite: ONLY the two deploy/rollback tests need `runuser`
      #     (root). Run via `sudo -E`; SUDO_USER (set by sudo) carries the original
      #     non-root runner user, so the deploy runs check_config as that non-root
      #     user. No production code is modified to accommodate CI. ---
      - name: Run root-required deployment tests (sudo)
        run: |
          PYBIN="$(which python)"
          sudo -E "$PYBIN" -m pytest \
            tests/deployment/test_cloud.py::test_deploy_idempotency \
            tests/deployment/test_cloud.py::test_rollback \
            -v -p no:cacheprovider -rA
