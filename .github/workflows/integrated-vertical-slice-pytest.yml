name: Integrated vertical slice pytest

on:
  push:
    branches:
      - demo/one-day-integrated-vertical-slice-20260727
  pull_request:
    branches:
      - canonical/phase-b-baseline-20260726

permissions:
  contents: read

jobs:
  integrated-vertical-slice-pytest:
    name: integrated-vertical-slice-pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install test runner
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1

      # --- Collect the full, real test set on the remote. T is the unique total
      #     test count and is NOT hardcoded; it comes from the live collection.
      #     NOTE: pytest wraps summary lines in '====' delimiters, so we never
      #     anchor on '^[0-9]+' — we match the count substring instead. ---
      - name: Collect tests (total T)
        id: collect
        run: |
          set +e -uo pipefail
          RAW=$(python -m pytest --collect-only -q -p no:cacheprovider 2>&1) || true
          echo "$RAW"
          # pytest -q collect-only emits per-file "path: N" lines and NO total
          # summary line, so sum the per-file counts to obtain the real T.
          T=$(echo "$RAW" | awk -F': ' '/:[[:space:]]*[0-9]+$/{s+=$2} END{print s+0}')
          if [ -z "$T" ] || [ "$T" = "0" ]; then
            echo "COLLECT_FAILED: could not determine T from collect-only output"
            exit 1
          fi
          echo "total=$T" >> "$GITHUB_OUTPUT"
          echo "T=$T"

      # --- Non-root suite: every baseline test EXCEPT the two deployment tests
      #     that legitimately require root (run separately with sudo -E below).
      #     The root-refusal guard (test_check_config_refuses_root) runs HERE and
      #     passes via the HERMES_SERVICE_USER mismatch gate — no skip. No xfail.
      #     No continue-on-error. If any test fails, the step exits non-zero. ---
      - name: Run non-root baseline test suite
        id: ordinary
        run: |
          set +e -uo pipefail
          OUT=$(python -m pytest tests/ -v -p no:cacheprovider -rA \
            --deselect tests/deployment/test_cloud.py::test_deploy_idempotency \
            --deselect tests/deployment/test_cloud.py::test_rollback 2>&1) || true
          echo "$OUT"
          SUMMARY=$(echo "$OUT" | grep -E '[0-9]+ (passed|failed|error|skipped|xfailed|xpassed)' | tail -1)
          PASSED=$(echo "$SUMMARY" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' | head -1)
          DESEL=$(echo "$SUMMARY" | grep -oE '[0-9]+ deselected' | grep -oE '[0-9]+' | head -1)
          echo "ordinary_passed=${PASSED:-0}" >> "$GITHUB_OUTPUT"
          echo "ordinary_deselected=${DESEL:-0}" >> "$GITHUB_OUTPUT"
          if [ -z "$SUMMARY" ]; then
            echo "ORDINARY_PARSE_FAIL: no summary line found in pytest output"
            exit 1
          fi
          if echo "$SUMMARY" | grep -qE '(failed|error|skipped|xfailed|xpassed)'; then
            echo "INTEGRITY_VIOLATION: non-root suite contains failed/error/skipped/xfailed/xpassed"
            exit 1
          fi

      # --- Root-required suite: ONLY the two deploy/rollback tests need `runuser`
      #     (root). Run via sudo -E; SUDO_USER (set by sudo) carries the original
      #     non-root runner user, so the deploy runs check_config as that non-root
      #     user. The check_config root refusal is NOT weakened. Any failure fails. ---
      - name: Run root-required deployment tests (sudo)
        id: privileged
        run: |
          set +e -uo pipefail
          PYBIN="$(which python)"
          OUT=$(sudo -E "$PYBIN" -m pytest \
            tests/deployment/test_cloud.py::test_deploy_idempotency \
            tests/deployment/test_cloud.py::test_rollback \
            -v -p no:cacheprovider -rA 2>&1) || true
          echo "$OUT"
          SUMMARY=$(echo "$OUT" | grep -E '[0-9]+ (passed|failed|error|skipped|xfailed|xpassed)' | tail -1)
          PASSED=$(echo "$SUMMARY" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' | head -1)
          echo "privileged_passed=${PASSED:-0}" >> "$GITHUB_OUTPUT"
          if [ -z "$SUMMARY" ]; then
            echo "PRIVILEGED_PARSE_FAIL: no summary line found in pytest output"
            exit 1
          fi
          if echo "$SUMMARY" | grep -qE '(failed|error|skipped|xfailed|xpassed)'; then
            echo "PRIVILEGED_VIOLATION: privileged suite contains failed/error/skipped/xfailed/xpassed"
            exit 1
          fi

      # --- Integrity: ordinary passed + privileged passed must equal the real T,
      #     exactly 2 tests deselected in the ordinary suite, exactly 2 privileged
      #     tests passed, and every other test executed exactly once. ---
      - name: Integrity check (ordinary + privileged == T)
        run: |
          set +e -uo pipefail
          T="${{ steps.collect.outputs.total }}"
          O="${{ steps.ordinary.outputs.ordinary_passed }}"
          P="${{ steps.privileged.outputs.privileged_passed }}"
          D="${{ steps.ordinary.outputs.ordinary_deselected }}"
          echo "IVS_TOTAL=$T"
          echo "IVS_ORDINARY_PASSED=$O"
          echo "IVS_ORDINARY_DESELECTED=$D"
          echo "IVS_PRIVILEGED_PASSED=$P"
          if [ "${D:-0}" != "2" ]; then echo "EXPECTED exactly 2 deselected in ordinary suite, got '${D}'"; exit 1; fi
          if [ "${P:-0}" != "2" ]; then echo "EXPECTED exactly 2 privileged tests passed, got '${P}'"; exit 1; fi
          if [ "$((O + P))" != "$T" ]; then echo "INTEGRITY_FAIL: ordinary($O)+privileged($P)=$((O+P)) != T($T)"; exit 1; fi
          echo "IVS_INTEGRITY_OK ordinary($O) + privileged($P) = $T"
